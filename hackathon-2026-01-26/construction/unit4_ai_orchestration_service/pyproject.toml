[project]
name = "unit4-ai-orchestration-service"
version = "0.1.0"
description = "AI Orchestration Service with Amazon Bedrock"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.5.0",
    "uvicorn>=0.27.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
